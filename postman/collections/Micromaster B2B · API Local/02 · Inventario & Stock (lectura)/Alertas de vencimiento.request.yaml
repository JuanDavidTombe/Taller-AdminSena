$kind: http-request
url: "{{baseUrl}}/api/stock/alerts"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      console.log('criticos:', j.critical_count, '| por vencer:', j.warning_count);
    language: text/javascript
order: 2000
