$kind: http-request
url: "{{baseUrl}}/api/stock/purchase-orders/OC-2026-001"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('OC encontrada', () => pm.expect(j.found).to.be.true);
      console.log('proveedor:', j.purchase_order.supplier_name, '| items:', j.purchase_order.items.length);
    language: text/javascript
order: 4000
