$kind: http-request
url: "{{baseUrl}}/api/stock/entry"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ingredient_id": 1,
      "batch_code": "POSTMAN-OP-{{$timestamp}}",
      "quantity": 10,
      "expiration_date": "2027-06-30",
      "storage_zone": "A-01",
      "quality_checklist": {
        "temperature": true,
        "packaging": true,
        "labeling": true,
        "sanitary_registry": true
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{operarioToken}}"
scripts:
  - type: afterResponse
    code: pm.test('201 - OPERARIO puede crear', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
