$kind: http-request
url: "{{baseUrl}}/api/stock/entry"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ingredient_id": 1,
      "batch_code": "POSTMAN-CONTADOR-{{$timestamp}}",
      "quantity": 1,
      "expiration_date": "2027-06-30",
      "storage_zone": "A-01",
      "quality_checklist": {
        "temperature": true,
        "packaging": true,
        "labeling": true,
        "sanitary_registry": true
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{contadorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 - WriteGuard bloquea escritura', () => pm.response.to.have.status(403));
      pm.test('Permiso requerido = create', () => pm.expect(pm.response.json().required_permission).to.eql('create'));
    language: text/javascript
order: 2000
