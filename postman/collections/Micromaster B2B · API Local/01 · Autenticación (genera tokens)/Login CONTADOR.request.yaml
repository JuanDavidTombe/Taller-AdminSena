$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "contabilidad@micromaster.com",
      "password": "contabilidad123"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      pm.environment.set('contadorToken', json.token);
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Rol = CONTADOR', () => pm.expect(json.user.role).to.eql('CONTADOR'));
      console.log('contador role_permissions:', JSON.stringify(json.user.role_permissions));
    language: text/javascript
order: 4000
